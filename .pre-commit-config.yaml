---
repos:
  # -------------------------
  # Basic hygiene
  # -------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  # -------------------------
  # C / C++ formatting
  # -------------------------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        files: \.(c|cpp|cc|cxx|h|hpp)$
        args: [--style=Google]

  # -------------------------
  # Static analysis (fast, embedded-friendly)
  # -------------------------
  # - repo: https://github.com/pocc/pre-commit-hooks
  #   rev: v1.3.5
  #   hooks:
  #     - id: cppcheck
  #       args:
  #         - --enable=all
  #         - --std=c++17
  #         - -Iinclude
  #         - -Isrc
  #     - id: clang-tidy
      # - id: uncrustify # do almost the same as clang-format
      # - id: cpplint # do almost the same as clang-format
      # - id: include-what-you-use # need local installation

  # -------------------------
  # Spelling check
  # -------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        name: codespell
        description: Checks for common misspellings in text files.
        entry: codespell  *
        language: python
        types: [text]

  # -------------------------
  # YAML formatting
  # -------------------------
  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 0.2.3
    hooks:
      - id: yamlfmt
        files: ^(?!.*compose).*$
        args: [--mapping, '2', --sequence, '4', --offset, '2', --width, '100']

  # -------------------------
  # Copyright check
  # -------------------------
  - repo: local
    hooks:
      - id: ament_copyright
        name: ament_copyright
        description: Check if copyright notice is available in all files.
        stages: [pre-commit]
        entry: ament_copyright
        language: system
        exclude: ^.*\.md$
